name: Screen reader

# Everything that needs a screen reader, simulated or real, lives here and not in ci.yml, so its dependencies and any
# machine setup stay out of the workflows that build, deploy and publish. No job here may use secrets or an
# environment. Real screen readers (which need @guidepup/setup and change system permissions) are only ever to run on
# GitHub-hosted runners, never on a self-hosted one.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A simulated screen reader reads the guide in jsdom. It is not a real one: no machine setup, no network after install.
  virtual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter speak-friend-screen-reader screen-reader:types
      - run: pnpm --filter speak-friend-screen-reader screen-reader
