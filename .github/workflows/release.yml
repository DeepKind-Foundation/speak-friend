name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # The screen reader tests and their dependencies are left out: this job holds the publish credentials.
      - run: pnpm install --frozen-lockfile --filter '!speak-friend-screen-reader*'
      # A filter that matches nothing is silently ignored, so a renamed package would be installed here without a word.
      - name: Fail if the screen reader dependencies were installed
        run: test ! -e apps/screen-reader/node_modules && test ! -e apps/voiceover/node_modules
      - run: node scripts/release-check.mjs "$GITHUB_REF_NAME"
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter speak-friend-react smoke
      - run: npm install -g npm@11.21.0
      - run: node scripts/release-publish.mjs "$GITHUB_REF_NAME"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag $flags
